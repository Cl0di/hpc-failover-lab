name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Unit and replication tests
        run: make test
      - name: Failover smoke test (4 local nodes, 1 killed)
        run: make smoke
      - name: Validate compose file
        run: docker compose -f cluster/docker-compose.yml config -q
