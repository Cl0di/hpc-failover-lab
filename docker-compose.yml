# 8 emulated compute nodes, 8 mock DPUs, coordinator, Prometheus and Grafana.
#
#   docker compose -f cluster/docker-compose.yml up --build -d
#   MODE=legacy DETECT=poll CKPT_INTERVAL=60 docker compose -f cluster/docker-compose.yml up -d   # baseline
#   ./cluster/kill_nodes.sh node0 node1                                                          # inject a fault
#
# Grafana: http://localhost:3000 (anonymous admin)   Prometheus: http://localhost:9090

x-lab: &lab
  build:
    context: ..
    dockerfile: cluster/Dockerfile
  image: hpc-failover-lab:latest
  networks: [fabric]

services:
  node0:
    <<: *lab
    hostname: node0
    command: python -m failover_lab.agent --node node0 --listen 0.0.0.0:50051 --advertise node0:50051
      --peers node1:50051,node2:50051 --gpu-mem-mb 512 --metrics-port 9100 --log-dir /logs
    volumes: [logs:/logs, shared_fs:/shared]
  dpu0:
    <<: *lab
    hostname: dpu0
    command: python -m failover_lab.dpu --node node0 --watch node0:50051 --coordinator coordinator:50050 --metrics-port 9100
    depends_on: [node0]
  node1:
    <<: *lab
    hostname: node1
    command: python -m failover_lab.agent --node node1 --listen 0.0.0.0:50051 --advertise node1:50051
      --peers node2:50051,node3:50051 --gpu-mem-mb 512 --metrics-port 9100 --log-dir /logs
    volumes: [logs:/logs, shared_fs:/shared]
  dpu1:
    <<: *lab
    hostname: dpu1
    command: python -m failover_lab.dpu --node node1 --watch node1:50051 --coordinator coordinator:50050 --metrics-port 9100
    depends_on: [node1]
  node2:
    <<: *lab
    hostname: node2
    command: python -m failover_lab.agent --node node2 --listen 0.0.0.0:50051 --advertise node2:50051
      --peers node3:50051,node4:50051 --gpu-mem-mb 512 --metrics-port 9100 --log-dir /logs
    volumes: [logs:/logs, shared_fs:/shared]
  dpu2:
    <<: *lab
    hostname: dpu2
    command: python -m failover_lab.dpu --node node2 --watch node2:50051 --coordinator coordinator:50050 --metrics-port 9100
    depends_on: [node2]
  node3:
    <<: *lab
    hostname: node3
    command: python -m failover_lab.agent --node node3 --listen 0.0.0.0:50051 --advertise node3:50051
      --peers node4:50051,node5:50051 --gpu-mem-mb 512 --metrics-port 9100 --log-dir /logs
    volumes: [logs:/logs, shared_fs:/shared]
  dpu3:
    <<: *lab
    hostname: dpu3
    command: python -m failover_lab.dpu --node node3 --watch node3:50051 --coordinator coordinator:50050 --metrics-port 9100
    depends_on: [node3]
  node4:
    <<: *lab
    hostname: node4
    command: python -m failover_lab.agent --node node4 --listen 0.0.0.0:50051 --advertise node4:50051
      --peers node5:50051,node6:50051 --gpu-mem-mb 512 --metrics-port 9100 --log-dir /logs
    volumes: [logs:/logs, shared_fs:/shared]
  dpu4:
    <<: *lab
    hostname: dpu4
    command: python -m failover_lab.dpu --node node4 --watch node4:50051 --coordinator coordinator:50050 --metrics-port 9100
    depends_on: [node4]
  node5:
    <<: *lab
    hostname: node5
    command: python -m failover_lab.agent --node node5 --listen 0.0.0.0:50051 --advertise node5:50051
      --peers node6:50051,node7:50051 --gpu-mem-mb 512 --metrics-port 9100 --log-dir /logs
    volumes: [logs:/logs, shared_fs:/shared]
  dpu5:
    <<: *lab
    hostname: dpu5
    command: python -m failover_lab.dpu --node node5 --watch node5:50051 --coordinator coordinator:50050 --metrics-port 9100
    depends_on: [node5]
  node6:
    <<: *lab
    hostname: node6
    command: python -m failover_lab.agent --node node6 --listen 0.0.0.0:50051 --advertise node6:50051
      --peers node7:50051,node0:50051 --gpu-mem-mb 512 --metrics-port 9100 --log-dir /logs
    volumes: [logs:/logs, shared_fs:/shared]
  dpu6:
    <<: *lab
    hostname: dpu6
    command: python -m failover_lab.dpu --node node6 --watch node6:50051 --coordinator coordinator:50050 --metrics-port 9100
    depends_on: [node6]
  node7:
    <<: *lab
    hostname: node7
    command: python -m failover_lab.agent --node node7 --listen 0.0.0.0:50051 --advertise node7:50051
      --peers node0:50051,node1:50051 --gpu-mem-mb 512 --metrics-port 9100 --log-dir /logs
    volumes: [logs:/logs, shared_fs:/shared]
  dpu7:
    <<: *lab
    hostname: dpu7
    command: python -m failover_lab.dpu --node node7 --watch node7:50051 --coordinator coordinator:50050 --metrics-port 9100
    depends_on: [node7]
  coordinator:
    <<: *lab
    hostname: coordinator
    command: python -m failover_lab.coordinator --nodes node0=node0:50051,node1=node1:50051,node2=node2:50051,node3=node3:50051,node4=node4:50051,node5=node5:50051,node6=node6:50051,node7=node7:50051
      --mode ${MODE:-inmem} --detect ${DETECT:-dpu} --ckpt-interval ${CKPT_INTERVAL:-15}
      --poll-timeout ${POLL_TIMEOUT:-5} --legacy-dir /shared --events /logs/events.jsonl --metrics-port 9100
    volumes: [logs:/logs, shared_fs:/shared]
    depends_on: [node0, node1, node2, node3, node4, node5, node6, node7]

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes: ["../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    networks: [fabric]
  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    networks: [fabric]
    depends_on: [prometheus]

networks:
  fabric: {}
volumes:
  logs: {}
  shared_fs: {}   # stands in for the shared parallel/NFS file system of the baseline
